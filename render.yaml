# Render Blueprint: one web service runs the whole app (web pages + game server + live connections).
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the keys it asks for.
services:
  - type: web
    name: huddle
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Build tools (vite, typescript, tsx) are devDependencies; install them on Render too.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # AI: mock (no key), openai_compatible (Groq/Llama), or anthropic (Claude).
      - key: LLM_PROVIDER
        value: mock
      # Meta Model API (OpenAI-compatible), Muse Spark 1.3 for every job. Set LLM_PROVIDER=openai_compatible once LLM_API_KEY is filled in.
      - key: LLM_BASE_URL
        value: https://api.meta.ai/v1
      - key: LLM_MODEL_SMART
        value: muse-spark-1.2
      - key: LLM_MODEL_FAST
        value: muse-spark-1.2
      - key: LLM_MODEL_VISION
        value: muse-spark-1.2
      - key: LLM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Voice: ElevenLabs whenever this key is set (set TTS_PROVIDER=browser to force the built-in voice).
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LLM_CACHE
        value: "on"
